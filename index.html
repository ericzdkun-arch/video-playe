<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video Experience</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
    .video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    iframe { width: 100%; height: 100%; border: 0; }
    
    /* 覆蓋整個螢幕的透明/點擊啟動層 */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #fff;
    }
    .play-icon {
      width: 80px;
      height: 80px;
      background: #ff0000;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    .play-icon::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 15px 0 15px 25px;
      border-color: transparent transparent transparent #fff;
      margin-left: 5px;
    }
    .hint-text {
      font-size: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- 點擊覆蓋層：點螢幕任何地方即帶聲開播 -->
  <div id="overlay" onclick="startPlayback()">
    <div class="play-icon"></div>
    <div class="hint-text">點擊螢幕開啟影片與聲音</div>
  </div>

  <div class="video-container">
    <div id="player"></div>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: 'fX5SjLq1TZo',
        playerVars: {
          'autoplay': 0, // 先不自動播放，等待點擊觸發
          'controls': 1,
          'playsinline': 1,
          'rel': 0
        }
      });
    }

    function startPlayback() {
      if (player && typeof player.playVideo === 'function') {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        // 點擊後淡出並隱藏啟動層
        document.getElementById('overlay').style.display = 'none';
      }
    }
  </script>
</body>
</html>
